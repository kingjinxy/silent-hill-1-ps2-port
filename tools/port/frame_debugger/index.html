<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SH1 Frame Debugger</title>
<style>
  :root {
    --bg: #f6f6f4; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6b66; --line: #dcdcd6;
    --accent: #2563eb; --bad: #c2410c; --badbg: #fff1e8; --sel: #dbeafe;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161615; --panel: #1f1f1d; --text: #e8e8e3; --muted: #9a9a92; --line: #33332f;
      --accent: #60a5fa; --bad: #fb923c; --badbg: #3a2416; --sel: #1e3a5f;
    }
  }
  :root[data-theme="dark"] {
    --bg: #161615; --panel: #1f1f1d; --text: #e8e8e3; --muted: #9a9a92; --line: #33332f;
    --accent: #60a5fa; --bad: #fb923c; --badbg: #3a2416; --sel: #1e3a5f;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, sans-serif; }
  header { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 10px 16px;
           border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 15px; margin: 0 12px 0 0; }
  select, button, input { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line);
                          border-radius: 6px; padding: 3px 8px; }
  button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 460px; gap: 12px; padding: 12px 16px; }
  @media (max-width: 1100px) { main { grid-template-columns: minmax(0, 1fr); } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px; min-width: 0; }
  .panel h2 { font-size: 13px; margin: 0 0 8px; color: var(--muted); font-weight: 600; }
  #view { width: 100%; image-rendering: pixelated; border-radius: 4px; background: #000; display: block; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
  .stat { color: var(--muted); }
  table { width: 100%; border-collapse: collapse; font: 12px/1.35 ui-monospace, monospace; }
  th, td { text-align: left; padding: 2px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: var(--bg); }
  tr.sel { background: var(--sel) !important; }
  tr.diff td:first-child { color: var(--bad); font-weight: 700; }
  .scroll { max-height: 340px; overflow: auto; }
  pre { font: 12px/1.4 ui-monospace, monospace; white-space: pre-wrap; margin: 0; overflow-wrap: anywhere; }
  .bad { color: var(--bad); }
  .tag { display: inline-block; padding: 0 6px; border-radius: 4px; background: var(--badbg); color: var(--bad); }
</style>
</head>
<body>
<header>
  <h1>SH1 Frame Debugger</h1>
  <label>Frame <select id="frame"></select></label>
  <span class="stat" id="summary"></span>
</header>
<main>
  <section class="panel">
    <div class="row">
      <button data-img="ps1" class="on">PS1 (DuckStation)</button>
      <button data-img="ps2">PS2 (port)</button>
      <button data-img="diff">Difference</button>
      <label><input type="checkbox" id="outlineAll"> outline all draws</label>
      <label><input type="checkbox" id="showBlame" checked> tint blamed pixels of the selected draw</label>
      <span class="stat" id="hover"></span>
    </div>
    <canvas id="view"></canvas>
    <h2 style="margin-top:12px">Selected draw</h2>
    <pre id="detail">Click a draw in a list, or a pixel in the image (its last draw).</pre>
  </section>
  <section class="panel">
    <h2>Blame: draws that last wrote differing pixels</h2>
    <div class="scroll" style="max-height:220px"><table><thead><tr><th>draw</th><th>pixels</th><th>type</th><th>stream</th></tr></thead><tbody id="blame"></tbody></table></div>
    <h2 style="margin-top:12px">Draws <span class="stat" id="drawCount"></span></h2>
    <div class="row">
      <label><input type="checkbox" id="onlyDiff"> only draws whose commands differ</label>
      <label><input type="checkbox" id="onlyVisible" checked> only draws touching the display</label>
    </div>
    <div class="scroll" style="max-height:520px"><table><thead><tr><th>#</th><th>type</th><th>verts</th><th>tpage/clut</th><th>flags</th></tr></thead><tbody id="draws"></tbody></table></div>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
